name: Local checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-go@v5
      with:
        go-version: '1.26.x'
        cache: false
    - run: go test -race ./... && go vet ./...
    - name: Bash syntax, shellcheck and failure-path tests
      run: |
        for file in scripts/*.sh; do bash -n "$file"; done
        shellcheck scripts/*.sh
        bash scripts/test-shell.sh
    - name: Released CRD and core Kubernetes schemas
      run: bash scripts/check-manifests.sh
    - run: docker build -t cpu-backend:check .
    - name: Secret scan (local process, no external scan service)
      run: |
        go install github.com/zricethezav/gitleaks/v8@v8.24.3
        gitleaks git --redact --no-banner

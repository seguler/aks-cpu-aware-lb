name: Local checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
    - run: go test -race ./... && go vet ./...
    - name: Released CRD and core Kubernetes schemas
      shell: pwsh
      run: ./scripts/check-manifests.ps1
    - run: docker build -t cpu-backend:check .
    - name: Secret scan (local process, no external scan service)
      run: |
        go install github.com/zricethezav/gitleaks/v8@v8.24.3
        gitleaks git --redact --no-banner

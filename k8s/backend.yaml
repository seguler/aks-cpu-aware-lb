apiVersion: v1
kind: Namespace
metadata:
  name: cpu-aware
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend
  namespace: cpu-aware
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cpu-aware-node-reader
rules:
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get"]
- apiGroups: ["metrics.k8s.io"]
  resources: ["nodes"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cpu-aware-node-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cpu-aware-node-reader
subjects:
- kind: ServiceAccount
  name: backend
  namespace: cpu-aware
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: backend
  namespace: cpu-aware
spec:
  selector:
    matchLabels:
      app: cpu-backend
  template:
    metadata:
      labels:
        app: cpu-backend
    spec:
      serviceAccountName: backend
      nodeSelector:
        cpu-aware-demo: "true"
        kubernetes.io/os: linux
      tolerations:
      - key: cpu-aware-demo
        operator: Equal
        value: "true"
        effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: backend
        image: SAMPLE_IMAGE
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: DEMO_TOKEN
          valueFrom:
            secretKeyRef:
              name: demo-auth
              key: token
        resources:
          requests:
            cpu: 100m
            memory: 32Mi
          limits:
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: cpu-aware
spec:
  selector:
    app: cpu-backend
  ports:
  - port: 8080
    targetPort: http
